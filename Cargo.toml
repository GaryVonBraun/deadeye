[package]
name = "osiris"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "2d",
    "audio",
    "ui",
    # "trace_tracy",
] }
bevy-inspector-egui = "0.37.0"
rand = { version = "0.10.1", features = ["std_rng"] }
ron = "0.12.1"
serde = "1.0.228"
uuid = "1.23.3"
bevy_egui = "0.40"
image = "0.25.10"
chrono = "0.4"
pretty-num = "0.1.2"

[features]
dev = ["bevy/dynamic_linking"]
# trace = ["bevy/trace_tracy"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
